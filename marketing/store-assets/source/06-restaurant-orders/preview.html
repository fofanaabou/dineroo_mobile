<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dineroo - Visuel 06 Restaurant Orders</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      font-family: Arial, sans-serif;
      background: #151515;
      color: #fff;
    }
    h1 { margin: 0 0 24px; font-size: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
      align-items: start;
    }
    .card {
      padding: 16px;
      border-radius: 18px;
      background: #242424;
    }
    .card h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #f58d1d;
    }
  </style>
</head>
<body>
  <h1>Visuel 06 - Restaurant Orders</h1>
  <div class="grid">
    <section class="card">
      <h2>Android 1080x1920</h2>
      <img src="../../android/06-restaurant-orders.png" alt="Dineroo Android restaurant orders marketing screenshot">
    </section>
    <section class="card">
      <h2>iOS 1290x2796</h2>
      <img src="../../ios/06-restaurant-orders.png" alt="Dineroo iOS restaurant orders marketing screenshot">
    </section>
  </div>
</body>
</html>
