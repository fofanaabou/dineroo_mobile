<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dineroo - Brand Hero Preview</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #181818;
      color: white;
      font-family: Arial, sans-serif;
    }

    .grid {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    figure {
      margin: 0;
    }

    figcaption {
      margin-bottom: 12px;
      font-weight: 700;
    }

    img {
      display: block;
      width: 320px;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
    }
  </style>
</head>
<body>
  <div class="grid">
    <figure>
      <figcaption>Android - 1080x1920</figcaption>
      <img src="../../android/00-brand-hero.png" alt="Dineroo brand hero Android" />
    </figure>
    <figure>
      <figcaption>iOS - 1290x2796</figcaption>
      <img src="../../ios/00-brand-hero.png" alt="Dineroo brand hero iOS" />
    </figure>
  </div>
</body>
</html>
