<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dineroo - Preview 02 Restaurants</title>
  <style>
    body { margin: 0; padding: 32px; font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; }
    h1 { margin: 0 0 24px; font-size: 24px; }
    .grid { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
    .card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 16px 42px rgba(15, 23, 42, .12); }
    .label { margin: 0 0 12px; font-weight: 700; }
    img { display: block; height: 720px; width: auto; border-radius: 12px; background: #ddd; }
  </style>
</head>
<body>
  <h1>Dineroo - visuel 02 restaurants</h1>
  <div class="grid">
    <div class="card">
      <p class="label">Android 1080x1920</p>
      <img src="../../android/02-restaurants-nearby.png" alt="Android preview" />
    </div>
    <div class="card">
      <p class="label">iOS 1290x2796</p>
      <img src="../../ios/02-restaurants-nearby.png" alt="iOS preview" />
    </div>
  </div>
</body>
</html>
