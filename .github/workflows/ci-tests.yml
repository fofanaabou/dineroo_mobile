name: CI Tests

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write

jobs:
  flutter-tests:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for flutter_dotenv
        run: |
          echo "API_BASE_URL=${API_BASE_URL:-https://api.test}" > .env
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Run tests with coverage
        run: flutter test --coverage --concurrency=4 --dart-define=DINEROO_SILENCE_LOGS=true

      - name: Check PR coverage
        id: pr_coverage
        continue-on-error: true
        run: |
          dart run tool/pr_coverage_check.dart \
            --lcov coverage/lcov.info \
            --base origin/${{ github.base_ref }} \
            --threshold 80 \
            --min-lines 20 \
            --output coverage/pr_coverage.md

      - name: Comment PR coverage
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'coverage/pr_coverage.md';
            if (!fs.existsSync(path)) {
              core.info('No PR coverage report found.');
              return;
            }

            const marker = '<!-- dineroo-pr-coverage -->';
            const body = `${marker}\n${fs.readFileSync(path, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.data.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Enforce PR coverage gate
        if: steps.pr_coverage.outcome == 'failure'
        run: |
          echo "PR coverage gate failed. See the report below for details."
          echo
          if [ -f coverage/pr_coverage.md ]; then
            cat coverage/pr_coverage.md
          else
            echo "No PR coverage report was generated. Check the 'Check PR coverage' step logs."
          fi
          exit 1
