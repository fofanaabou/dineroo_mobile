name: CI Web

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  flutter-web:
    name: Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for flutter_dotenv
        run: |
          echo "API_BASE_URL=${API_BASE_URL:-https://api.test}" > .env
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

      # Only files tagged @TestOn('browser'): the rest of the suite targets the Dart VM.
      - name: Run browser tests
        run: flutter test --platform chrome $(grep -rl "@TestOn('browser')" test)

      - name: Build web
        run: flutter build web --release

      # The app reads its API URL from .env at runtime; the web host must serve it from assets/.
      - name: Check .env is shipped in the web build
        run: test -f build/web/assets/.env
